name: Build

on:
  workflow_dispatch:
  pull_request:

env:
  XDL_VERSION: 3.4.20-1

jobs:
  tooling:
    name: Tooling
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Test the scripts
        run: tests/tooling/run.sh

      - name: Apply and export
        run: |
          tools/apply.sh
          tools/export.sh
          git diff --exit-code -- patches/
          test -z "$(git status --porcelain --untracked-files=all -- patches/)"

      - name: Write the range-diff to the job summary
        if: github.event_name == 'pull_request'
        run: |
          {
            echo '```'
            tools/range-diff.sh "${{ github.event.pull_request.base.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  webgpu:
    name: WebGPU
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # tools/emsdk-env.sh uses the Emscripten of this workload.
      - name: Install the .NET 11 preview SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Install Chromium and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          mkdir -p build/node
          (cd build/node && npm init -y > /dev/null && npm install playwright-core@1.63.0 --no-audit --no-fund)
          build/node/node_modules/.bin/playwright-core install --with-deps chromium

      - name: Build and run the smoke test
        run: |
          tools/apply.sh
          source tools/emsdk-env.sh
          emcmake cmake -S tests/webgpu -B build/webgpu-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/webgpu-test --parallel "$(nproc)"
          tests/webgpu/run-test.sh

  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-22.04, flags: -GNinja, library: lib/libXDL3.so.0, output: libXDL3.so, ctest: true }
          - { rid: linux-arm64, os: ubuntu-22.04-arm, flags: -GNinja, library: lib/libXDL3.so.0, output: libXDL3.so, ctest: true }
          - { rid: win-x64, os: windows-2025, flags: -A x64, library: bin/XDL3.dll, output: XDL3.dll, ctest: true }
          # Cross-compiled on Intel, because jobs for the arm64 macOS runners wait for capacity until GitHub cancels them
          - { rid: osx-arm64, os: macos-15-intel, flags: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0, library: lib/libXDL3.0.dylib, output: libXDL3.dylib, ctest: false }
          # osx-arm64 binaries cannot run on that runner, so this job runs the tests and publishes nothing
          - { rid: osx-x64-tests, os: macos-15-intel, flags: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0, ctest: true }

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc g++ cmake ninja-build wayland-protocols pkg-config \
            libasound2-dev libdbus-1-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libibus-1.0-dev libpango1.0-dev libpulse-dev libsndio-dev libudev-dev libwayland-dev \
            libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libxss-dev \
            libxt-dev libxv-dev libxxf86vm-dev libdrm-dev libgbm-dev libpipewire-0.3-dev libdecor-0-dev libjack-dev \
            libusb-1.0-0-dev

      - name: Apply patches
        run: tools/apply.sh

      - name: Build
        run: |
          cmake -S build/SDL -B build/cmake ${{ matrix.flags }} -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=ON -DSDL_TESTS=ON -DSDL_DISABLE_INSTALL_DOCS=ON -DSDL_RELOCATABLE=ON \
            "-DSDL_VENDOR_INFO=XDL-$XDL_VERSION" "-DSDL_REVISION=SDL-${XDL_VERSION%-*}-${GITHUB_SHA::12}"
          cmake --build build/cmake --config Release --parallel
          cmake --install build/cmake --prefix build/install --config Release

      - name: Run tests
        if: matrix.ctest
        env:
          SDL_TESTS_QUICK: 1
        run: ctest --test-dir build/cmake -C Release --no-tests=error --output-on-failure -j2

      - name: Check the library name
        if: runner.os == 'Linux'
        run: |
          readelf -d build/install/lib/libXDL3.so.0 | grep -F '(SONAME)' | grep -F '[libXDL3.so.0]'
          PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig" pkg-config --libs sdl3 | grep -E -- '(^| )-lXDL3( |$)'

      - name: Link a small project against the installed package
        run: |
          cmake -S tests/consumer -B build/consumer ${{ matrix.flags }} -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$PWD/build/install"
          cmake --build build/consumer --config Release

      - name: Collect the runtime
        if: matrix.library
        run: |
          mkdir -p "runtimes/${{ matrix.rid }}/native"
          cp -L "build/install/${{ matrix.library }}" "runtimes/${{ matrix.rid }}/native/${{ matrix.output }}"

      - name: Upload
        if: matrix.library
        uses: actions/upload-artifact@v4
        with:
          name: xdl3-${{ matrix.rid }}
          path: runtimes
          if-no-files-found: error
