name: Build

on:
  workflow_dispatch:
  pull_request:
  # Release runs this workflow before it publishes the artifacts.
  workflow_call:
    outputs:
      emscripten-version:
        description: The Emscripten that built the browser archives.
        value: ${{ jobs.browser.outputs.emscripten-version }}

jobs:
  tooling:
    name: Tooling
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # A run started by hand, such as the update pull request's, compares with main
      - name: Find the base revision
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: echo "BASE_REVISION=${PULL_REQUEST_BASE:-$(git merge-base origin/main HEAD)}" >> "$GITHUB_ENV"

      - name: Test the scripts
        run: tests/tooling/run.sh

      - name: Apply and export
        run: |
          for project in SDL SDL_image SDL_ttf SDL_mixer; do
            tools/apply.sh "$project"
            tools/export.sh "$project"
          done
          git diff --exit-code -- 'patches*'
          test -z "$(git status --porcelain --untracked-files=all -- 'patches*')"

      # Also after a failed export, which an upstream move causes even when every patch applies
      - name: Write the range-diffs to the job summary
        if: ${{ !cancelled() && env.BASE_REVISION != '' }}
        run: |
          for project in SDL SDL_image SDL_ttf SDL_mixer; do
            echo "### $project"
            echo '```'
            tools/range-diff.sh "$BASE_REVISION" "$project"
            echo '```'
          done >> "$GITHUB_STEP_SUMMARY"

      - name: Check that a change to a release raises XDL_VERSION
        if: ${{ !cancelled() && env.BASE_REVISION != '' }}
        run: tools/check-version.sh "$BASE_REVISION"

  # The archives link only into a .NET runtime built with the same Emscripten, the one of .NET 11's wasm-tools workload. The zip keeps the
  # .NET RID browser-wasm inside, and a later .NET gets a target of its own.
  browser:
    name: browser-wasm-net11
    runs-on: ubuntu-24.04
    outputs:
      emscripten-version: ${{ steps.emscripten.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set the version and revision
        run: |
          xdl_version=$(cat XDL_VERSION)
          echo "XDL_VERSION=$xdl_version" >> "$GITHUB_ENV"
          echo "XDL_REVISION=SDL-${xdl_version%-*}-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      # tools/emsdk-env.sh uses the Emscripten of this workload.
      - name: Install the .NET 11 preview SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Find the Emscripten version
        id: emscripten
        run: |
          source tools/emsdk-env.sh
          version=$(emcc --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          [[ -n "$version" ]] || { echo "No version in the first line of emcc --version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Chromium and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          mkdir -p build/node
          (cd build/node && npm init -y > /dev/null && npm install playwright-core@1.63.0 --no-audit --no-fund)
          build/node/node_modules/.bin/playwright-core install --with-deps chromium

      - name: Apply patches
        run: for project in SDL SDL_image SDL_ttf SDL_mixer; do tools/apply.sh "$project"; done

      - name: Build and run the WebGPU smoke test
        run: |
          source tools/emsdk-env.sh
          emcmake cmake -S tests/webgpu -B build/webgpu-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/webgpu-test --parallel "$(nproc)"
          tests/webgpu/run-test.sh

      - name: Build
        run: |
          source tools/emsdk-env.sh
          tools/build-browser.sh build/install "-DSDL_VENDOR_INFO=XDL-$XDL_VERSION" "-DSDL_REVISION=$XDL_REVISION"

      - name: Collect the runtime
        run: tools/collect-runtime.sh browser-wasm build/install runtimes/browser-wasm/native

      # In a shell without emsdk-env.sh, with a cache of its own: a .NET link into the cache that emsdk-env.sh uses emptied it once.
      - name: Link the archives into a .NET browser app
        run: |
          dotnet publish tests/browser-dotnet -c Release -o build/dotnet-link "-p:XdlArchiveDirectory=$PWD/runtimes/browser-wasm/native" \
            "-p:WasmCachePath=$PWD/build/dotnet-em-cache"
          node tests/browser-dotnet/run.mjs build/dotnet-link/wwwroot

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: xdl3-browser-wasm-net11
          path: runtimes
          if-no-files-found: error

  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-22.04, flags: -GNinja, ctest: true }
          - { rid: linux-arm64, os: ubuntu-22.04-arm, flags: -GNinja, ctest: true }
          - { rid: win-x64, os: windows-2025, flags: -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded, ctest: true }
          # SDL's own CI runs no tests on Windows ARM64, and testprocess crashes there in process_testStdinToStdout
          - { rid: win-arm64, os: windows-11-arm, flags: -A ARM64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded, ctest: true, ctest_args: -E ^testprocess$ }
          # Cross-compiled on Intel, because jobs for the arm64 macOS runners wait for capacity until GitHub cancels them.
          - { rid: osx-arm64, os: macos-15-intel, flags: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0, ctest: false }
          # osx-arm64 binaries cannot run on that runner, so this job runs the macOS tests
          - { rid: osx-x64, os: macos-15-intel, flags: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0, ctest: true }

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set the version and revision
        run: |
          xdl_version=$(cat XDL_VERSION)
          echo "XDL_VERSION=$xdl_version" >> "$GITHUB_ENV"
          echo "XDL_REVISION=SDL-${xdl_version%-*}-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc g++ cmake ninja-build wayland-protocols pkg-config \
            libasound2-dev libdbus-1-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libibus-1.0-dev libpango1.0-dev libpulse-dev libsndio-dev libudev-dev libwayland-dev \
            libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libxss-dev \
            libxt-dev libxv-dev libxxf86vm-dev libdrm-dev libgbm-dev libpipewire-0.3-dev libdecor-0-dev libjack-dev \
            libusb-1.0-0-dev

      - name: Apply patches
        run: for project in SDL SDL_image SDL_ttf SDL_mixer; do tools/apply.sh "$project"; done

      - name: Build
        run: |
          cmake -S build/SDL -B build/cmake ${{ matrix.flags }} -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=ON -DSDL_TESTS=ON -DSDL_DISABLE_INSTALL_DOCS=ON -DSDL_RELOCATABLE=ON \
            "-DSDL_VENDOR_INFO=XDL-$XDL_VERSION" "-DSDL_REVISION=$XDL_REVISION" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build/cmake --config Release --parallel
          cmake --install build/cmake --prefix build/install --config Release

      - name: Run tests
        if: matrix.ctest
        env:
          SDL_TESTS_QUICK: 1
        run: ctest --test-dir build/cmake -C Release --no-tests=error --output-on-failure -j2 ${{ matrix.ctest_args }}

      - name: Check the library name
        if: runner.os == 'Linux'
        run: |
          readelf -d build/install/lib/libXDL3.so.0 | grep -F '(SONAME)' | grep -F '[libXDL3.so.0]'
          PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig" pkg-config --libs sdl3 | grep -E -- '(^| )-lXDL3( |$)'

      - name: Link a small project against the installed package
        run: |
          cmake -S tests/consumer -B build/consumer ${{ matrix.flags }} -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$PWD/build/install"
          cmake --build build/consumer --config Release

      - name: Build the satellite libraries
        run: for project in SDL_image SDL_ttf SDL_mixer; do tools/build-project.sh "$project" build/install ${{ matrix.flags }}; done

      - name: Collect the runtime
        run: tools/collect-runtime.sh "${{ matrix.rid }}" build/install "runtimes/${{ matrix.rid }}/native"

      - name: Check the dependencies
        run: |
          status=0
          for library in "runtimes/${{ matrix.rid }}/native"/*; do
            tools/check-dependencies.sh "$library" || status=1
          done
          exit $status

      - name: Link a small project against the satellite libraries
        run: |
          cmake -S tests/satellites -B build/satellites ${{ matrix.flags }} -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$PWD/build/install" \
            "-DRUNTIME_DIR=$PWD/runtimes/${{ matrix.rid }}/native" "-DXDL_REVISION=$XDL_REVISION"
          cmake --build build/satellites --config Release

      - name: Load the runtime
        if: matrix.ctest
        run: ctest --test-dir build/satellites -C Release --no-tests=error --output-on-failure

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: xdl3-${{ matrix.rid }}
          path: runtimes
          if-no-files-found: error

      - name: Write the third-party notices
        if: matrix.rid == 'linux-x64'
        run: tools/third-party-notices.sh build/install build/THIRD-PARTY-NOTICES.txt

      # Its own artifact, so every xdl3-<target> artifact has the same layout
      - name: Upload the third-party notices
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: build/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
