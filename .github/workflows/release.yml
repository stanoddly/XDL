name: Release

# Publishes XDL_VERSION as the GitHub release v<XDL_VERSION> when that tag does not exist yet. Merging a pull request that raises
# XDL_VERSION releases it. A failed release is run again by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    # A run started from another branch would release unreviewed code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      # A shallow checkout has no tags, so every push would look unreleased.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the tag
        id: tag
        run: |
          tag="v$(cat XDL_VERSION)"
          if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
            # A change since the tag would never be released, as when two pull requests raised XDL_VERSION to the same value.
            tools/check-version.sh "$tag"
          else
            # Fails on a malformed XDL_VERSION. With HEAD as the base, no release input counts as changed.
            tools/check-version.sh HEAD
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    uses: ./.github/workflows/build.yml

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      EMSCRIPTEN_VERSION: ${{ needs.build.outputs.emscripten-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Each xdl3-<target> artifact holds <rid>/native/, and each zip holds runtimes/<rid>/native/, the layout of a NuGet package. The target
      # is the RID, except for browser-wasm-net11, whose zip holds the .NET RID browser-wasm. The licenses ask for their notices to go with
      # the binaries, so each zip also holds THIRD-PARTY-NOTICES.txt. xdl3-headers.zip holds include/ for every target, and the notices. The
      # release has a copy of the notices to read online.
      - name: Zip the runtimes and the headers
        run: |
          mkdir dist
          for artifact in artifacts/xdl3-*; do
            target=${artifact#artifacts/xdl3-}
            mkdir -p "staging/$target/runtimes"
            cp -R "$artifact"/. "staging/$target/runtimes/"
            cp artifacts/third-party-notices/THIRD-PARTY-NOTICES.txt "staging/$target/"
            (cd "staging/$target" && zip -q -r "$GITHUB_WORKSPACE/dist/xdl3-$target.zip" runtimes THIRD-PARTY-NOTICES.txt)
          done
          mkdir -p staging/headers
          cp -R artifacts/headers/include staging/headers/
          cp artifacts/third-party-notices/THIRD-PARTY-NOTICES.txt staging/headers/
          (cd staging/headers && zip -q -r "$GITHUB_WORKSPACE/dist/xdl3-headers.zip" include THIRD-PARTY-NOTICES.txt)
          cp artifacts/third-party-notices/THIRD-PARTY-NOTICES.txt dist/
          ls -l dist

      # A submodule's version is the upstream tag of its commit. The checkout fetches no submodule tags, so ls-remote finds it.
      - name: Write the release notes
        run: |
          {
            echo "XDL $TAG: SDL with XDL's patches, and SDL_image, SDL_ttf and SDL_mixer built against it as XDL3_image, XDL3_ttf and XDL3_mixer."
            echo
            echo "| Library | Version | Commit |"
            echo "|---|---|---|"
            echo "| XDL | $TAG | [${GITHUB_SHA::7}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |"
            for path in $(git config --file .gitmodules --get-regexp '^submodule\.external/.*\.path$' | awk '{ print $2 }'); do
              url=$(git config --file .gitmodules --get "submodule.$path.url")
              url=${url%.git}
              commit=$(git rev-parse "HEAD:$path")
              version=$(git ls-remote --tags "$url" | awk -v commit="$commit" '$1 == commit { name = $2; sub(/^refs\/tags\//, "", name); sub(/\^\{\}$/, "", name); print name; exit }')
              echo "| ${path#external/} | $version | [${commit::7}]($url/commit/$commit) |"
            done
            echo
            echo "Each runtime zip holds \`runtimes/<rid>/native/\` with XDL3 and the three satellite libraries, and the licenses in \`THIRD-PARTY-NOTICES.txt\`. Load XDL3 before a satellite when you load them by path."
            echo
            echo "\`xdl3-browser-wasm-net11.zip\` holds static archives for the .NET 11 browser runtime in \`runtimes/browser-wasm/native/\`, built with Emscripten $EMSCRIPTEN_VERSION and \`-fwasm-exceptions -sWASM_LEGACY_EXCEPTIONS=0\`. They link only into a .NET runtime built with the same Emscripten."
            echo
            echo "\`xdl3-headers.zip\` holds the C headers of XDL3 and the satellites in \`include/\`, the same for every target, such as for generating bindings."
          } > release-notes.md
          cat release-notes.md

      # gh release create would otherwise attach the release to a tag made while this run built.
      - name: Publish the release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG was released while this run built." >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md --target "$GITHUB_SHA"
