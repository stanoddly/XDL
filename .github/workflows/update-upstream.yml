name: Update upstream

# Proposes the newest releases of SDL, SDL_image, SDL_ttf and SDL_mixer in a pull request. A person reviews and merges it, because a new
# release can break a patch, or keep it applying while the code around it changes.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-upstream
  cancel-in-progress: false

jobs:
  update:
    # A run started from another branch would propose an update made by unreviewed tools.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: update-upstream

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Newer releases wait until the open pull request is merged or closed.
      - name: Look for an open pull request
        id: open
        run: echo "count=$(gh pr list --head "$BRANCH" --state open --json number --jq length)" >> "$GITHUB_OUTPUT"

      - name: Move to the newest releases
        id: update
        if: steps.open.outputs.count == '0'
        run: |
          tools/update-upstream.sh > "$RUNNER_TEMP/summary.md"
          if [[ ! -s "$RUNNER_TEMP/summary.md" ]]; then
            echo "Every project is on its newest release."
            exit 0
          fi
          title=$(head -n 1 "$RUNNER_TEMP/summary.md")
          # The title names every target tag. A closed pull request with this title was declined, and only a newer release proposes again.
          declined=$(gh pr list --head "$BRANCH" --state closed --limit 1 --json title,state --jq '.[] | select(.state == "CLOSED") | .title')
          if [[ "$declined" == "$title" ]]; then
            echo "A closed pull request already proposed: $title"
            exit 0
          fi
          tail -n +3 "$RUNNER_TEMP/summary.md" > "$RUNNER_TEMP/body.md"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      # Pushes and pull requests made with GITHUB_TOKEN start no workflow runs, so the build is started by hand.
      - name: Open the pull request
        if: steps.update.outputs.title != ''
        env:
          TITLE: ${{ steps.update.outputs.title }}
        run: |
          # A branch left by a closed pull request would reject the new commit.
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git push origin --delete "$BRANCH"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          # update-upstream.sh staged the moved submodules and XDL_VERSION.
          git commit --quiet --message "$TITLE"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          gh workflow run build.yml --ref "$BRANCH"
